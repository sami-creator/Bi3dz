<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/images/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>profile — souk nsa</title>
<link rel="stylesheet" href="css/themes.css?v=1.1.0">
<link rel="stylesheet" href="css/base.css?v=1.1.0">
<link rel="stylesheet" href="css/rtl.css?v=1.1.0">
<link rel="stylesheet" href="css/components.css?v=1.1.0">
<link rel="stylesheet" href="css/pages.css?v=1.1.0">
</head>
<body class="is-gated" data-page="profile">
<main class="container">
  <div class="profile-top-actions" id="own-actions">
    <span></span>
    <div class="row">
      <a class="icon-btn" href="chat.html" data-i18n-aria="profile.messages">💬</a>
      <a class="icon-btn" href="notifications.html" data-i18n-aria="notif.title">🔔</a>
    </div>
  </div>
  <section class="profile-head">
    <img id="p-avatar" class="avatar" alt="" src="assets/images/avatar.svg">
    <h1 class="page-title" style="margin:4px 0"><span id="p-name"></span> <span id="p-tick" class="verified-tick" hidden>✓</span></h1>
    <p id="p-bio" class="profile-bio" hidden></p>
    <div class="profile-stats">
      <div><b id="s-followers">0</b><span data-i18n="profile.followers"></span></div>
      <div><b id="s-ads">0</b><span data-i18n="profile.ads"></span></div>
      <div><b id="s-rating">0.0</b><span data-i18n="profile.rating"></span></div>
    </div>
    <button id="btn-share-profile" class="btn btn--ghost profile-share" type="button">🔗 <span data-i18n="profile.share"></span></button>
  </section>
  <div id="public-links" class="contact-links" style="justify-content:center;margin-bottom:12px" hidden></div>
  <nav class="menu-list" id="own-menu">
    <a href="favorites.html"><span data-i18n="profile.prefs"></span><span>♥</span></a>
    <button id="btn-ads" type="button"><span data-i18n="profile.ads"></span><span>▾</span></button>
    <div id="ads-sub" class="menu-list" hidden>
      <a href="post-ad.html"><span data-i18n="ad.add"></span></a>
      <a href="my-ads.html"><span data-i18n="ad.manage"></span></a>
    </div>
    <a href="edit-profile.html"><span data-i18n="profile.edit"></span></a>
    <a href="verify.html"><span id="verify-label" data-i18n="profile.verify"></span></a>
    <button id="btn-upgrade" type="button"><span data-i18n="profile.upgrade"></span></button>
    <button id="btn-logout" type="button"><span data-i18n="auth.logout"></span></button>
  </nav>
  <section id="user-ads" class="user-ads" hidden>
    <h3 data-i18n="profile.ads"></h3>
    <div id="grid" class="grid"></div>
  </section>
</main>
<script src="js/env.js?v=1.1.0"></script>
