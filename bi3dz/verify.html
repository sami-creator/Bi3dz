<body class="is-gated" data-page="verify">
<main class="container">
  <h1 class="page-title" data-i18n="profile.verify"></h1>
  <div id="state" class="card-box" hidden></div>
  <form id="form-verify" class="card-box" novalidate hidden>
    <div class="field"><label for="id-front" data-i18n="verify.id_front"></label><input id="id-front" class="input" type="file" accept="image/jpeg,image/png,image/webp"></div>
    <div class="field"><label for="id-back" data-i18n="verify.id_back"></label><input id="id-back" class="input" type="file" accept="image/jpeg,image/png,image/webp"></div>
    <div class="field"><label for="phone" data-i18n="verify.phone"></label>
      <div class="row"><input id="phone" class="input" type="tel" inputmode="tel" maxlength="16" autocomplete="tel"><button id="btn-code" class="btn btn--ghost" type="button" data-i18n="verify.send_code"></button></div></div>
    <div class="field"><label for="code" data-i18n="verify.code"></label><input id="code" class="input" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
    <button id="btn-submit" class="btn btn--primary btn--block" type="submit" data-i18n="verify.submit"></button>
  </form>
</main>
