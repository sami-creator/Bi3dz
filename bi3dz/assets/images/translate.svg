<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="googleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4" />
      <stop offset="100%" style="stop-color:#1a73e8" />
    </linearGradient>
  </defs>
  
  <!-- Carré arrondi style Google -->
  <rect x="2" y="2" width="20" height="20" rx="4" fill="url(#googleBlue)" />
  
  <!-- Symbole de traduction Google (caractère chinois stylisé "文") -->
  <g transform="translate(12, 12) scale(0.9)">
    <!-- Traits du caractère 文 -->
    <path d="M-6 -5 L6 -5" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M-5 -5 L-2 2 L-6 6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M5 -5 L2 2 L6 6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M-3 0 L3 0" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- Petit badge "ع" pour indiquer l'arabe -->
  <circle cx="18" cy="18" r="5" fill="#FBBC04" />
  <text x="18" y="21" font-size="7" font-family="Arial, sans-serif" font-weight="bold" fill="white" text-anchor="middle">ع</text>
</svg>