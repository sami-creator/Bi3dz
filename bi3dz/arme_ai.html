<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعد ذكي</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #212121;
    color: #ececec;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .msg {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 18px;
    line-height: 1.7;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .user {
    background: #2f2f2f;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  .bot {
    background: #1a1a1a;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid #333;
  }

  .thinking {
    color: #888;
    font-style: italic;
    font-size: 14px;
    align-self: flex-start;
    padding: 8px 14px;
  }

  #bar {
    padding: 12px 16px;
    background: #212121;
    border-top: 1px solid #333;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #input {
    flex: 1;
    background: #2f2f2f;
    border: 1px solid #444;
    border-radius: 14px;
    padding: 12px 16px;
    color: #ececec;
    font-size: 15px;
    resize: none;
    outline: none;
    max-height: 160px;
    overflow-y: auto;
    font-family: inherit;
    line-height: 1.5;
  }

  #input::placeholder { color: #666; }

  #btn {
    background: #10a37f;
    border: none;
    border-radius: 10px;
    width: 44px;
    height: 44px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }

  #btn:hover { background: #0d8f6f; }
  #btn:disabled { background: #444; cursor: not-allowed; }

  #btn svg { fill: white; width: 20px; height: 20px; }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

  .bot table {
    border-collapse: collapse;
    width: 100%;
    margin-top: 8px;
    font-size: 14px;
  }
  .bot th, .bot td {
    border: 1px solid #555;
    padding: 8px 12px;
    text-align: right;
  }
  .bot th {
    background: #2a2a2a;
    color: #10a37f;
  }
  .bot tr:nth-child(even) { background: #222; }
  .bot p { margin-bottom: 6px; }
  .bot ul, .bot ol { padding-right: 20px; }
  .bot code {
    background: #2f2f2f;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .bot pre {
    background: #2f2f2f;
    padding: 10px;
    border-radius: 8px;
    overflow-x: auto;
    margin-top: 6px;
  }
  .msg.bot { white-space: normal; }
</style>
</head>
<body>

<div id="chat"></div>

<div id="bar">
  <textarea id="input" rows="1" placeholder="اكتب سؤالك..."></textarea>
  <button id="btn">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const btn = document.getElementById("btn");

  function addMsg(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addThinking() {
    const div = document.createElement("div");
    div.className = "thinking";
    div.textContent = "جاري التفكير...";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function send() {
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    input.style.height = "auto";
    btn.disabled = true;

    addMsg(q, "user");
    const thinking = addThinking();

    try {
      const res = await fetch("http://localhost:5000/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q })
      });
      const data = await res.json();
      thinking.remove();
      const div = document.createElement("div");
      div.className = "msg bot";
      div.innerHTML = marked.parse(data.answer);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    } catch (e) {
      thinking.remove();
      addMsg("❌ تعذر الاتصال بالسيرفر. تأكد أن server.py يعمل في Pydroid3.", "bot");
    }

    btn.disabled = false;
    input.focus();
  }

  btn.addEventListener("click", send);

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });
</script>
</body>
</html>
