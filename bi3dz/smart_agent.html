<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="icon" href="assets/images/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المساعد الذكي — souk nsa</title>
<link rel="stylesheet" href="css/themes.css?v=1.1.0">
<link rel="stylesheet" href="css/base.css?v=1.1.0">
<link rel="stylesheet" href="css/rtl.css?v=1.1.0">
<link rel="stylesheet" href="css/components.css?v=1.1.0">
<style>
/* ═══════════════════════════════════════════════════════
   Smart Agent — تصميم شبيه بتلغرام
═══════════════════════════════════════════════════════ */

/* ── صفحة كاملة الارتفاع بدون scroll خارجي ─────────── */
html, body { height: 100%; overflow: hidden; }

.sa-page {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 680px;
  margin: 0 auto;
  background: var(--bg-page, #0e0e0e);
  position: relative;
}

/* ── رأس الصفحة ──────────────────────────────────────── */
.sa-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-card, #1a1a1a);
  border-bottom: 1px solid var(--border, #2a2a2a);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 10;
}

.sa-header__back {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--accent, #F472B6);
  padding: 6px;
  border-radius: 8px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.sa-header__back:hover { background: var(--bg-hover, #2a2a2a); }

.sa-header__avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent, #F472B6), var(--accent-dark, #c026d3));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.sa-header__info { flex: 1; min-width: 0; }
.sa-header__title {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-primary, #f1f1f1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sa-header__sub {
  font-size: 0.75rem;
  color: var(--text-muted, #888);
}

.sa-header__clear {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted, #888);
  padding: 6px;
  border-radius: 8px;
  font-size: 0.78rem;
}
.sa-header__clear:hover { color: var(--accent, #F472B6); background: var(--bg-hover, #2a2a2a); }

/* ── منطقة المحادثة ──────────────────────────────────── */
#sa-chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  scroll-behavior: smooth;
}

/* ── فقاعات الرسائل ──────────────────────────────────── */
.sa-bubble {
  max-width: 78%;
  padding: 9px 13px;
  border-radius: 16px;
  font-size: 0.9rem;
  line-height: 1.55;
  white-space: pre-wrap;
  word-break: break-word;
  animation: sa-fade-in 0.18s ease;
}

@keyframes sa-fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* رسائل المستخدم — يمين بلون مميز */
.sa-bubble--user {
  align-self: flex-end;
  background: var(--accent, #F472B6);
  color: #fff;
  border-bottom-left-radius: 4px;
}

/* رسائل البوت — يسار */
.sa-bubble--bot {
  align-self: flex-start;
  background: var(--bg-card, #1e1e1e);
  color: var(--text-primary, #f1f1f1);
  border-bottom-right-radius: 4px;
  border: 1px solid var(--border, #2a2a2a);
}

/* رسائل الخطأ */
.sa-bubble--error {
  align-self: center;
  background: rgba(239,68,68,.15);
  color: #f87171;
  border: 1px solid rgba(239,68,68,.3);
  font-size: 0.82rem;
  border-radius: 10px;
  padding: 7px 12px;
  max-width: 90%;
  text-align: center;
}

/* Typing indicator */
.sa-bubble--typing {
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 12px 16px;
}
.sa-bubble--typing span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-muted, #888);
  animation: sa-bounce 1.2s infinite;
}
.sa-bubble--typing span:nth-child(2) { animation-delay: 0.2s; }
.sa-bubble--typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes sa-bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30%           { transform: translateY(-6px); }
}

/* ── منطقة الإدخال ───────────────────────────────────── */
.sa-footer {
  flex-shrink: 0;
  padding: 10px 14px max(14px, env(safe-area-inset-bottom));
  background: var(--bg-card, #1a1a1a);
  border-top: 1px solid var(--border, #2a2a2a);
}

.sa-input-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

#sa-input {
  flex: 1;
  background: var(--bg-page, #111);
  border: 1px solid var(--border, #333);
  border-radius: 20px;
  padding: 10px 16px;
  color: var(--text-primary, #f1f1f1);
  font-family: inherit;
  font-size: 0.88rem;
  resize: none;
  max-height: 100px;
  overflow-y: auto;
  line-height: 1.5;
  outline: none;
  transition: border-color .15s;
}
#sa-input:focus { border-color: var(--accent, #F472B6); }
#sa-input::placeholder { color: var(--text-muted, #666); }

#sa-send {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--accent, #F472B6);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform .12s, opacity .12s;
}
#sa-send:disabled { opacity: .5; cursor: not-allowed; }
#sa-send:not(:disabled):hover { transform: scale(1.08); }
#sa-send svg { width: 20px; height: 20px; fill: #fff; }

/* عداد الحروف */
.sa-chars {
  font-size: 0.72rem;
  color: var(--text-muted, #777);
  text-align: end;
  margin-top: 4px;
  padding: 0 4px;
  min-height: 16px;
}
.sa-chars--warn { color: #f97316; }
.sa-chars--over { color: #ef4444; font-weight: 700; }

/* ── RTL/LTR اتجاه فقاعات حسب لغة ─────────────────── */
[lang="ar"] .sa-bubble--user,
[dir="rtl"]  .sa-bubble--user {
  border-bottom-left-radius: 4px;
  border-bottom-right-radius: 16px;
}
[lang="ar"] .sa-bubble--bot,
[dir="rtl"]  .sa-bubble--bot {
  border-bottom-right-radius: 4px;
  border-bottom-left-radius: 16px;
}

/* ── Scrollbar رفيع ────────────────────────────────── */
#sa-chat::-webkit-scrollbar { width: 4px; }
#sa-chat::-webkit-scrollbar-track { background: transparent; }
#sa-chat::-webkit-scrollbar-thumb { background: var(--border, #333); border-radius: 4px; }
</style>
</head>
<body data-page="smart_agent">

<div class="sa-page">

  <!-- رأس الصفحة -->
  <header class="sa-header">
    <button class="sa-header__back" id="sa-back" aria-label="رجوع" onclick="history.back()">
      <!-- سهم رجوع -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>

    <div class="sa-header__avatar" aria-hidden="true">🤖</div>

    <div class="sa-header__info">
      <div class="sa-header__title" data-i18n="agent.title">المساعد الذكي</div>
      <div class="sa-header__sub"   data-i18n="agent.subtitle">مساعدك للدعم الفني</div>
    </div>

    <button class="sa-header__clear" id="sa-clear" data-i18n="agent.clear" aria-label="مسح المحادثة">مسح</button>
  </header>

  <!-- منطقة المحادثة -->
  <main id="sa-chat" role="log" aria-live="polite" aria-label="المحادثة"></main>

  <!-- منطقة الإدخال -->
  <footer class="sa-footer">
    <div class="sa-input-row">
      <textarea
        id="sa-input"
        rows="1"
        maxlength="200"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        data-i18n-placeholder="agent.placeholder"
        placeholder="اكتبي رسالتك... (200 حرف كحد أقصى)"
        aria-label="رسالة"
      ></textarea>

      <button id="sa-send" type="button" aria-label="إرسال" disabled>
        <!-- أيقونة إرسال -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <div class="sa-chars" id="sa-chars" aria-live="polite"></div>
  </footer>

</div>

<!-- Scripts — نفس ترتيب بقية صفحات المشروع -->
<script src="js/env.js?v=1.1.0"></script>
<script src="js/config.js?v=1.1.0"></script>
<script src="js/console-logger.js?v=1.1.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase.js?v=1.1.0"></script>
<script src="js/sanitize.js?v=1.1.0"></script>
<script src="js/utils.js?v=1.1.0"></script>
<script src="js/ui.js?v=1.1.0"></script>
<script src="js/i18n.js?v=1.1.0"></script>
<script src="js/theme.js?v=1.1.0"></script>
<script src="js/router.js?v=1.1.0"></script>
<script src="js/auth.js?v=1.1.0"></script>
<script src="js/fingerprint.js?v=1.1.0"></script>
<script src="js/smart-agent.js?v=1.1.0"></script>
<script src="js/app.js?v=1.1.0"></script>
<script src="js/logger.js?v=1.1.0"></script>
<script>
  // تفعيل زر الإرسال فقط عندما يوجد نص
  (function () {
    const input  = document.getElementById('sa-input');
    const sendB  = document.getElementById('sa-send');
    if (!input || !sendB) return;

    function toggle() {
      sendB.disabled = input.value.trim().length === 0;
    }
    input.addEventListener('input', toggle);
    toggle();

    // auto-resize textarea
    input.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });
  })();

  // تهيئة المساعد عند جهوزية التطبيق
  document.addEventListener('DOMContentLoaded', async function() {
        await Promise.all([window.I18n?.init?.(), window.Theme?.init?.()]);
    // تحديث اتجاه الصفحة حسب اللغة
    const lang = window.I18n?.lang ?? 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';

    // تطبيق ترجمات data-i18n
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (key) el.textContent = window.I18n?.t?.(key) ?? el.textContent;
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.dataset.i18nPlaceholder;
      if (key) el.placeholder = window.I18n?.t?.(key) ?? el.placeholder;
    });

    SmartAgent.init();
  });
</script>
</body>
</html>
